include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Lỗi không thể tha thứ (Ép thành Error đỏ)
    avoid_print: error
    always_use_package_imports: error
    directives_ordering: error
    prefer_const_constructors: error
    prefer_const_declarations: error
    prefer_const_constructors_in_immutables: error
    prefer_const_literals_to_create_immutables: error
    prefer_typing_uninitialized_variables: error
    require_trailing_commas: error
    sort_child_properties_last: error

    # Bỏ qua warning không cần thiết cho code gen
    invalid_annotation_target: ignore

linter:
  rules:
    # ----------------------------------------------------
    # QUY TẮC BẮT BUỘC TỪ AGENTS.md
    # ----------------------------------------------------
    - avoid_print # (R12) Cấm dùng print(), phải dùng debugPrint
    - always_use_package_imports # (R8) Khuyến khích dùng absolute import
    - prefer_const_constructors # (R4.5) Bắt buộc const
    - prefer_const_declarations # (R4.5) Bắt buộc const declarations
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables

    # ----------------------------------------------------
    # CHẤT LƯỢNG CODE & AN TOÀN TRẠNG THÁI
    # ----------------------------------------------------
    - always_declare_return_types # Rõ ràng kiểu trả về
    - prefer_final_locals # Ép dùng "final" thay cho "var" nếu không đổi
    - unawaited_futures # Bắt buộc dùng "await" khi gọi async, không được quên
    - require_trailing_commas # Ép phẩy cuối câu ở widget tree (tự format sẽ đẹp hơn)
    - sort_child_properties_last # Thuộc tính "child" hoặc "children" luôn nằm cuối cùng
    - cancel_subscriptions # Chống memory leak
    - close_sinks
    - avoid_empty_else
    - prefer_single_quotes # Dùng nháy đơn cho string
    - avoid_slow_async_io
    - directives_ordering # Buộc sắp xếp import đúng chuẩn
    - sized_box_for_whitespace # Ép dùng SizedBox thay vì Container rỗng

custom_lint:
  rules:
    # Riverpod lint rules
    - avoid_build_context_in_providers: true
    - avoid_public_notifier_properties: true
    - avoid_ref_inside_state_dispose: true
    - functional_ref: true
    - missing_provider_scope: true
    - notifier_build: true
    - notifier_extends: true
    - provider_dependencies: true
    - provider_parameters: true
    - protected_notifier_properties: true
    - unsupported_provider_value: true

    # ForgeAI architecture lint rules
    - forge_no_hardcoded_colors: true
    - forge_no_direct_text_style: true
    - forge_no_raw_route_strings: true
    - forge_widget_file_size: true
    - forge_one_public_widget_per_file: true
    - forge_no_direct_state_provider_mutation_in_widgets: true
